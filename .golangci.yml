version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec]
      # Sample data for the demo does not need cryptographic randomness.
      - path: cmd/demo-producer/
        text: G404
  settings:
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mauricioacevedo/kafka-mcp
